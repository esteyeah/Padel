# Serveur en ligne de Padel Arena : un Worker Cloudflare qui sert le jeu (dossier ../public)
# et un Durable Object « Hub » qui gère le salon, les parties et les tournois (WebSocket).
name = "padel-arena"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../public"
not_found_handling = "single-page-application"
run_worker_first = ["/ws"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]
